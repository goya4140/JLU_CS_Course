<h1>数据结构 Glossary</h1>
<h2>待掌握</h2>
<p><strong>哨位结点</strong>：放在第一个有效数据结点前的辅助结点，不计入表长，用于统一表头和中间位置的操作。</p>
<p><strong>松弛</strong>：发现一条经当前顶点到达邻点的更短路径时，更新邻点的暂定距离。</p>
<p><strong>分划</strong>：围绕主元重新安排区间，使主元落在最终位置，左右两侧分别满足约定的大小关系。</p>
