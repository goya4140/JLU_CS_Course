<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="StudyMate 课程总览：多科目学习进度、路线图与课件入口。">
<title>我的课程 · StudyMate</title>

<!-- Sayo UI（vendored，MIT）+ 本项目共享主题层。
     两者都由 gen_home.py 拷进学习工作区的 .learning/assets/；
     本模板只声明引用，不改样式来源 -->
<link rel="stylesheet" href=".learning/assets/sayo/sayo.css">
<link rel="stylesheet" href=".learning/assets/learn-theme.css">

<!-- 主题：首帧前应用已保存的主题（共享逻辑在 assets/learn-theme.js，
     暗色是默认（Sayo 的 Primer 暗色），亮色=我们的暖色系；URL 加 ?theme=light 可临时预览） -->
<script src=".learning/assets/learn-theme.js"></script>
<script>LearnTheme.apply();</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   根主页（课程总览）· 页面专属样式
   组件来自 Sayo（nav / stat / card / tag / btn / toggle / grid），
   主题令牌在 learn-theme.css：亮色=暖纸白+深绿，暗色=Sayo 暗色。
   本页样式全部内联：主页是生成产物，生成器只替换 LEARN 数据占位符注释行，
   其余内容原样保留。
   ═══════════════════════════════════════════════════════════════ */

/* ── 导航栏 ── */
.learn-nav-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--syo-space-2);
}
.learn-nav-logo { width: 18px; height: 18px; color: var(--syo-accent); }

.learn-nav-date {
  font-family: var(--syo-font-mono);
  font-size: .75rem;
  color: var(--syo-fg-muted);
  margin-right: var(--syo-space-2);
}

/* ── 抬头区 ── */
.learn-hero {
  position: relative;
  overflow: hidden;
  padding: clamp(44px, 7vw, 76px) 0 clamp(30px, 4vw, 44px);
}

/* 亮色抬头：网格层已从本页撤掉（背景层那套现在只剩星云在暗色下用），
   改成一层极淡的冷色洗（--learn-soft-blue，调色板里的柔和蓝，不新造色值）——
   否则冷色的看板娘压在暖纸白上像"贴上去的" */
html[data-theme="light"] .learn-hero {
  background: linear-gradient(180deg, var(--learn-soft-blue) 0%, transparent 62%);
}

.learn-hero__inner { position: relative; z-index: 1; }

/* 抬头主视觉：透明底看板娘（左）+ 发光字（右）。本页不再有星空层——
   角色图接替它当抬头视觉，星云微光保留（否则角色是浮在纯色上的）。
   看板娘是共享资源 learn-mascot.png，由生成流程拷进 .learning/assets/ */
.learn-hero__brand-row {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.2vw, 26px);
}

.learn-hero__mascot {
  flex: none;
  width: clamp(124px, 16vw, 224px);
  height: auto;
}
/* 看板娘**不带外发光**：暗色下那圈蓝晕会在深底上糊成一团光斑，人物反而脏；
   亮色原来还要垫白晕压网格，网格撤掉之后白晕也没有存在理由了 */
html[data-theme="light"] .learn-hero__mascot {
  filter: none;
}

/* 品牌字：**真意大利体衬线 + 镂空描边**——字身透明，靠一圈 --brand-ink 描边 + 光晕成形。
   字体栈是有意写长的：C059（Century Schoolbook 开源同族）→ Charter → Noto Serif → Georgia，
   全是各平台自带的**真意大利体**衬线，哪台机器上都是"斜体衬线"这个设计意图，不会退化成无衬线。
   墨色只有一个来源 --brand-ink：暗色 = Sayo 紫强调（--syo-accent），
   亮色在下面的覆盖里换成主题的黑（--syo-fg-default）——描边与两层光晕都跟着它走，
   所以"换颜色"永远只改一个变量。
   - 不用 background-clip:text 填充：那个写法的渐变背景盒就是元素盒，line-height 一压紧，
     "y" 的下伸部就落到盒外拿不到颜色 → 看着像被截断。描边画在字形上，不受盒子限制。
   - 光晕走 filter: drop-shadow：镂空字的"形状"就是那圈描边，drop-shadow 跟着描边走，
     正好是霓虹灯管的效果；text-shadow 会从透明的字身里透出来，把镂空糊死。
   - 刷新时的入场动效见下面的 learn-brand-in。 */
.learn-hero__brand {
  --brand-ink: var(--syo-accent);
  margin: 0;
  font-family: "C059", "Century Schoolbook L", "Bitstream Charter", "Noto Serif", Georgia, serif;
  font-style: italic;
  font-size: clamp(2.1rem, 6.8vw, 5.2rem);
  font-weight: 700;
  letter-spacing: -.005em;
  line-height: 1.16;
  color: transparent;
  -webkit-text-stroke: .034em var(--brand-ink);
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--brand-ink) 52%, transparent))
          drop-shadow(0 0 26px color-mix(in srgb, var(--brand-ink) 28%, transparent));
  animation: learn-brand-in 900ms var(--syo-ease-out) 60ms backwards;
}
/* 亮色：**同样是镂空描边**——字形两个主题一致，只换墨色与光晕强度。
   上一版在亮色改实心，是因为当时网格还在：镂空会让网格从笔画里透出来。
   网格整层撤掉之后，纸白底上的镂空就是干净的"钢印"，没有理由再换字形。
   墨色取 --syo-secondary（调色板里的蓝，与看板娘同一个色系）；光晕比暗色收细——
   暖纸白上的大光晕只会糊成一团雾。 */
html[data-theme="light"] .learn-hero__brand {
  --brand-ink: var(--syo-secondary);
  filter: drop-shadow(0 0 7px color-mix(in srgb, var(--brand-ink) 22%, transparent))
          drop-shadow(0 0 18px color-mix(in srgb, var(--brand-ink) 12%, transparent));
}

/* 刷新时的 logo 动效：光晕由弱到强"点亮"，同时字距从松收到紧、整体轻微上浮。
   起点必须是**看得见**的状态——本仓库的规矩是入场动效不许从 opacity:0 或
   "描边宽度 0"起手（卡片入场也只动 transform），否则动画一旦没跑起来，
   抬头就是一片空白。属性只挑不动可见性的：letter-spacing / transform / filter。
   prefers-reduced-motion 下由 Sayo 的全局规则把时长压成 0，直接落到终态。 */
@keyframes learn-brand-in {
  0% {
    letter-spacing: .085em;
    transform: translateY(8px);
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--brand-ink) 20%, transparent))
            drop-shadow(0 0 10px color-mix(in srgb, var(--brand-ink) 10%, transparent));
  }
  55% { letter-spacing: -.026em; }
  100% { letter-spacing: -.005em; }
}
/* 看板娘与品牌字同一条入场节奏（错开 60ms 起手），只动 transform */
@keyframes learn-mascot-in {
  from { transform: translateY(10px); }
  to   { transform: none; }
}
.learn-hero__mascot { animation: learn-mascot-in 900ms var(--syo-ease-out) backwards; }

/* 抬头里不再有可见的页面标题与副标题：字面的"我的课程"是 h1.syo-sr-only 里的，
   屏幕上由品牌字承担（页签 <title> 里也有"我的课程 · StudyMate"） */

/* ── 主体 ── */
.learn-main { padding-top: 0; }

.learn-stats { margin-bottom: var(--syo-space-2); }

/* ── 卡片入场：只动 transform，不动 opacity。
       opacity:0 起手的入场动画一旦没跑起来（动画被禁用/极慢设备/打印），
       整页主要内容就是隐形的；只位移不透明，最坏情况也只是错位 8px。
       backwards 填充：动画结束不保留 transform，Sayo 卡片自带的 hover 弹性立即可用 ── */
@keyframes learn-card-in {
  from { transform: translateY(8px); }
  to   { transform: none; }
}
.learn-subject-card { animation: learn-card-in .4s var(--syo-ease-elastic) backwards; }
.learn-subject-card:nth-child(2) { animation-delay: .04s; }
.learn-subject-card:nth-child(3) { animation-delay: .08s; }
.learn-subject-card:nth-child(4) { animation-delay: .12s; }
.learn-subject-card:nth-child(5) { animation-delay: .16s; }
.learn-subject-card:nth-child(n+6) { animation-delay: .20s; }

/* 入场动画只在首帧播放：播放完摘掉动画，避免筛选切换时重播 */
body.is-ready .learn-subject-card { animation: none; }

/* ── 窄屏补充（网格与导航的响应式由 Sayo 自己处理） ── */
@media (max-width: 768px) {
  /* Sayo 在窄屏把 grid-4 压成一列，4 个统计块会占满一屏；两列更合用 */
  .learn-stats { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 640px) {
  .learn-nav-date { display: none; }
  /* 看板娘缩一号：560px 以下字号已经吃到下限，再占 120px 会把标题挤成两行 */
  .learn-hero__mascot { width: 104px; }
}
</style>
</head>

  <!-- 统计概览：数值由页面脚本从卡片的数据属性实时算出，生成器无需为此准备占位符。

      ============================================================

    -->

<script src=".learning/assets/sayo/sayo.js"></script>
<script>
(function () {
  'use strict';

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 抬头不再有视差层：星空被看板娘接替（见 .learn-hero__mascot），
     本页因此也没有 data-syo-parallax——主题切换只剩主题本身要切 */

  /* ---------- 主题开关（主题本身已在 <head> 里应用） ---------- */
  var themeCheckbox = document.getElementById('learn-theme-checkbox');
  LearnTheme.wire(themeCheckbox);

  /* ---------- 今天日期（导航栏右上角） ---------- */
  var dateText = '';
  try {
    dateText = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch (e) {
    dateText = new Date().toISOString().slice(0, 10);
  }
  var todayNav = document.getElementById('learn-today');
  if (todayNav) todayNav.textContent = dateText;

  /* ---------- 卡片数据 ---------- */
  var cards = Array.prototype.slice.call(document.querySelectorAll('.learn-subject-card'));
  var statsEl = document.getElementById('learn-stats');
  var filterEl = document.getElementById('learn-filter');
  var filterEmptyEl = document.getElementById('learn-filter-empty');
  var emptyEl = document.getElementById('learn-empty');

  /* 没有任何科目：隐藏统计与筛选，显示引导空状态 */
  if (cards.length === 0) {
    if (statsEl) statsEl.hidden = true;
    if (filterEl) filterEl.hidden = true;
    if (emptyEl) emptyEl.hidden = false;
    document.body.classList.add('is-ready');
    return;
  }
  if (emptyEl) emptyEl.hidden = true;

  /* ---------- 统计概览 ---------- */
  var STATUS_ACTIVE = '进行中';
  var STATUS_DONE = '已完成';

  var total = cards.length;
  var activeCount = cards.filter(function (c) { return c.dataset.status === STATUS_ACTIVE; }).length;
  var doneCount = cards.filter(function (c) { return c.dataset.status === STATUS_DONE; }).length;
  var mastery = Math.round(
    cards.reduce(function (sum, c) { return sum + (parseFloat(c.dataset.mastery) || 0); }, 0) / total * 100
  );

  function countUp(el, target, suffix) {
    if (!el) return;
    suffix = suffix || '';
    if (reduced) { el.textContent = target + suffix; return; }
    var duration = 520;
    var start = null;
    var settled = false;
    /* 兜底：无论 rAF 是否被浏览器节流，最终都必须落到真实数值，
       否则标签页在后台加载时会一直显示动画中途的错误数字 */
    function settle() {
      if (settled) return;
      settled = true;
      el.textContent = target + suffix;
    }
    function step(ts) {
      if (settled) return;
      if (start === null) start = ts;
      var p = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else settle();
    }
    requestAnimationFrame(step);
    window.setTimeout(settle, duration + 150);
  }

  countUp(document.getElementById('learn-stat-total'), total);
  countUp(document.getElementById('learn-stat-active'), activeCount);
  countUp(document.getElementById('learn-stat-done'), doneCount);
  countUp(document.getElementById('learn-stat-mastery'), mastery, '%');

  /* ---------- 筛选计数 ---------- */
  var pausedCount = cards.filter(function (c) { return c.dataset.status === '暂停'; }).length;
  var counts = { all: total, active: activeCount, paused: pausedCount, done: doneCount };
  Object.keys(counts).forEach(function (key) {
    var el = document.querySelector('.learn-filter__count[data-count="' + key + '"]');
    if (el) el.textContent = counts[key];
  });

  /* ---------- 筛选 ---------- */
  var FILTER_KEY = 'le-filter';
  var FILTER_MAP = { '进行中': 'active', '暂停': 'paused', '已完成': 'done' };
  var currentFilter = '全部';
  try {
    var savedFilter = localStorage.getItem(FILTER_KEY);
    if (savedFilter) currentFilter = savedFilter;
  } catch (e) {}

  function applyFilter(name) {
    var visible = 0;
    cards.forEach(function (card) {
      var show = (name === '全部') || (card.dataset.status === name);
      card.hidden = !show;
      if (show) visible++;
    });
    if (filterEmptyEl) filterEmptyEl.hidden = visible > 0;
    if (filterEl) {
      Array.prototype.forEach.call(filterEl.querySelectorAll('.learn-filter__btn'), function (btn) {
        var on = btn.dataset.filter === name;
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
  }

  if (filterEl) {
    filterEl.addEventListener('click', function (event) {
      var btn = event.target.closest('.learn-filter__btn');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      applyFilter(currentFilter);
      try { localStorage.setItem(FILTER_KEY, currentFilter); } catch (e) {}
    });
  }

  /* 保存的筛选值可能已失效（如“暂停”科目已删除），回落到“全部” */
  if (currentFilter !== '全部' && !counts[FILTER_MAP[currentFilter]]) currentFilter = '全部';
  applyFilter(currentFilter);

  /* ---------- 进度条展开动画 ----------
     宽度的真值写在卡片的内联 style 里（无 JS 也正确）；
     这里先归零再回到真值来播放展开，rAF 被节流时由定时器兜底落到真值。 */
  cards.forEach(function (card) {
    var bar = card.querySelector('.learn-progress__bar');
    if (!bar) return;
    var target = Math.round((parseFloat(card.dataset.progress) || 0) * 100) + '%';
    if (reduced) { bar.style.width = target; return; }
    bar.style.width = '0%';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { bar.style.width = target; });
    });
    window.setTimeout(function () { bar.style.width = target; }, 160);
  });

  /* ---------- 首次入场动画播放完就停用，避免筛选切换时重播 ---------- */
  window.setTimeout(function () { document.body.classList.add('is-ready'); }, 900);
})();
</script>
</body>
</html>
