<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img"><title>质心与转动惯量：给质量加权</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="475" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">质心与转动惯量：给质量加权</text><text x="38" y="78" class="small">质心用坐标加权；转动惯量用到旋转轴的垂直距离平方加权。</text><path d="M100,320 Q200,80 410,220" class="line"/><path d="M500,130 L500,410" fill="none" stroke="#de8a36" stroke-width="4"/><circle cx="305" cy="188" r="10" fill="#187c87"/><path d="M305,188 L500,188" class="line" marker-end="url(#a)"/><text x="318" y="168" class="label">到轴的距离 r</text><text x="230" y="234" class="label">微小质量 dm</text><rect x="600" y="135" width="340" height="225" rx="12" fill="white" stroke="#bcd4da"/><text x="618" y="169" class="label">同一个 dm，不同权重</text><text x="618" y="203" class="small">总质量：∫ dm</text><text x="618" y="231" class="small">质心横坐标：∫ x dm / m</text><text x="618" y="259" class="small">绕指定轴：∫ r² dm</text><text x="618" y="287" class="small">r 由轴的位置决定</text></svg>