<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img"><title>第5章 · 第二型积分知识地图</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="635" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">第5章 · 第二型积分知识地图</text><text x="38" y="78" class="small">从几何意义出发，把概念、计算与题型连起来。</text><rect x="350" y="105" width="300" height="82" rx="12" fill="white" stroke="#bcd4da"/><text x="368" y="139" class="label">积累的对象决定微元</text><text x="368" y="173" class="small">先认清几何对象，再选择方法</text><path d="M500,187 L250,250" class="line" marker-end="url(#a)"/><path d="M500,187 L750,250" class="line" marker-end="url(#a)"/><path d="M500,187 L500,418 L250,418 L250,430" class="line" marker-end="url(#a)"/><path d="M500,187 L500,418 L750,418 L750,430" class="line" marker-end="url(#a)"/><rect x="35" y="250" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="53" y="284" class="label">第二型曲线积分</text><text x="53" y="318" class="small">力 · 位移：Pdx + Qdy + Rdz</text><text x="53" y="346" class="small">参数方向决定上下限</text><text x="53" y="374" class="small">全微分 → 终点减起点</text><rect x="535" y="250" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="553" y="284" class="label">Green 与路径无关</text><text x="553" y="318" class="small">平面闭曲线 → 二重积分</text><text x="553" y="346" class="small">补线、挖洞、面积</text><text x="553" y="374" class="small">单连通域与偏导相等</text><rect x="35" y="430" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="53" y="464" class="label">第二型曲面积分</text><text x="53" y="498" class="small">通量：向量场 · 法向量</text><text x="53" y="526" class="small">上侧 / 下侧 / 内侧 / 外侧</text><text x="53" y="554" class="small">向量面积元保留符号</text><rect x="535" y="430" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="553" y="464" class="label">Gauss 与 Stokes</text><text x="553" y="498" class="small">封闭面 → 散度的体积分</text><text x="553" y="526" class="small">空间闭曲线 → 旋度的通量</text><text x="553" y="554" class="small">补面、右手方向、奇点</text></svg>