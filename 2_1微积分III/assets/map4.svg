<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img"><title>第4章 · 第一型积分知识地图</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="635" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">第4章 · 第一型积分知识地图</text><text x="38" y="78" class="small">从几何意义出发，把概念、计算与题型连起来。</text><rect x="350" y="105" width="300" height="82" rx="12" fill="white" stroke="#bcd4da"/><text x="368" y="139" class="label">积累的对象决定微元</text><text x="368" y="173" class="small">先认清几何对象，再选择方法</text><path d="M500,187 L250,250" class="line" marker-end="url(#a)"/><path d="M500,187 L750,250" class="line" marker-end="url(#a)"/><path d="M500,187 L500,418 L250,418 L250,430" class="line" marker-end="url(#a)"/><path d="M500,187 L500,418 L750,418 L750,430" class="line" marker-end="url(#a)"/><rect x="35" y="250" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="53" y="284" class="label">曲线积分</text><text x="53" y="318" class="small">密度 × 弧长 ds</text><text x="53" y="346" class="small">参数化 → 一元定积分</text><text x="53" y="374" class="small">圆弧 / 折线 / 空间曲线</text><rect x="535" y="250" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="553" y="284" class="label">曲面积分</text><text x="553" y="318" class="small">密度 × 面积 dS</text><text x="553" y="346" class="small">投影 / 参数化 → 二重积分</text><text x="553" y="374" class="small">图形面 / 球面 / 柱面</text><rect x="35" y="430" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="53" y="464" class="label">性质与技巧</text><text x="53" y="498" class="small">线性、分段、估值</text><text x="53" y="526" class="small">对称性：域与函数一起看</text><text x="53" y="554" class="small">面积、长度与平均值</text><rect x="535" y="430" width="430" height="155" rx="12" fill="white" stroke="#bcd4da"/><text x="553" y="464" class="label">物理应用</text><text x="553" y="498" class="small">质量 → 质心</text><text x="553" y="526" class="small">距离平方 → 转动惯量</text><text x="553" y="554" class="small">距离向量 → 引力</text></svg>