<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">第4章：按章节顺序展开的学习路线</title>
<desc id="map-desc">按正文十个小节顺序，从曲线积分到曲面积分，再到统一视角与物理应用，最后整理方法并自测。每行从左向右，各行自上而下。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243747}.muted{fill:#657789}</style>
<rect width="1120" height="810" rx="20" fill="#FAFBFD"/>
<text x="40" y="43" font-size="13" letter-spacing="2" class="muted">CHAPTER 04 · 学习路线</text>
<text x="40" y="85" font-size="34" font-weight="600">第一型积分</text>
<text x="40" y="117" font-size="18" class="muted">按正文顺序读：每行从左到右，再进入下一行。</text>
<rect x="660" y="40" width="420" height="80" rx="14" fill="#203E50"/>
<text x="684" y="72" font-size="17" style="fill:#FFFFFF">共同思想：函数值 × 几何微元</text>
<text x="684" y="100" font-size="16" style="fill:#B8D6DF">曲线取 ds · 曲面取 dS · 分割后累加</text>
<path d="M64 180 V658" fill="none" stroke="#DDE6EC" stroke-width="3"/>

<circle cx="64" cy="174" r="12" fill="#168A88"/>
<rect x="98" y="148" width="982" height="132" rx="16" fill="white" stroke="#E0E7EE"/>
<text x="120" y="176" font-size="18" font-weight="600" style="fill:#168A88">曲线：理解 → 定义 → 计算 → 简化</text>
<text x="1058" y="176" text-anchor="end" font-size="14" class="muted">§1—§4</text>
<rect x="120.0" y="196" width="30" height="24" rx="7" fill="#E9F5F3"/>
<text x="135.0" y="214" text-anchor="middle" font-size="13" font-weight="600" style="fill:#168A88">01</text>
<text x="160.0" y="214" font-size="18" font-weight="500">从定积分走向</text>
<text x="160.0" y="238" font-size="18" font-weight="500">曲线与曲面</text>
<text x="160.0" y="263" font-size="14" class="muted">从分段质量理解累加</text>
<text x="340.0" y="226" text-anchor="middle" font-size="20" style="fill:#168A88">→</text>
<rect x="354.0" y="196" width="30" height="24" rx="7" fill="#E9F5F3"/>
<text x="369.0" y="214" text-anchor="middle" font-size="13" font-weight="600" style="fill:#168A88">02</text>
<text x="394.0" y="214" font-size="18" font-weight="500">第一型曲线积分</text>
<text x="394.0" y="238" font-size="18" font-weight="500">的定义与性质</text>
<text x="394.0" y="263" font-size="14" class="muted">先认清积分的对象</text>
<text x="574.0" y="226" text-anchor="middle" font-size="20" style="fill:#168A88">→</text>
<rect x="588.0" y="196" width="30" height="24" rx="7" fill="#E9F5F3"/>
<text x="603.0" y="214" text-anchor="middle" font-size="13" font-weight="600" style="fill:#168A88">03</text>
<text x="628.0" y="214" font-size="18" font-weight="500">弧长元与曲</text>
<text x="628.0" y="238" font-size="18" font-weight="500">线积分计算</text>
<text x="628.0" y="263" font-size="14" class="muted">求 ds，再代入计算</text>
<text x="808.0" y="226" text-anchor="middle" font-size="20" style="fill:#168A88">→</text>
<rect x="822.0" y="196" width="30" height="24" rx="7" fill="#E9F5F3"/>
<text x="837.0" y="214" text-anchor="middle" font-size="13" font-weight="600" style="fill:#168A88">04</text>
<text x="862.0" y="214" font-size="18" font-weight="500">对称性如何减少计算</text>
<text x="862.0" y="263" font-size="14" class="muted">域与函数一起检查</text>
<circle cx="64" cy="322" r="12" fill="#4777B5"/>
<rect x="98" y="296" width="982" height="132" rx="16" fill="white" stroke="#E0E7EE"/>
<text x="120" y="324" font-size="18" font-weight="600" style="fill:#4777B5">曲面：面积元 → 完整例题</text>
<text x="1058" y="324" text-anchor="end" font-size="14" class="muted">§5—§6</text>
<rect x="120.0" y="344" width="30" height="24" rx="7" fill="#EDF2FA"/>
<text x="135.0" y="362" text-anchor="middle" font-size="13" font-weight="600" style="fill:#4777B5">05</text>
<text x="160.0" y="362" font-size="18" font-weight="500">第一型曲面积分与面积元</text>
<text x="160.0" y="411" font-size="14" class="muted">投影与参数两种工具</text>
<text x="574.0" y="374" text-anchor="middle" font-size="20" style="fill:#4777B5">→</text>
<rect x="588.0" y="344" width="30" height="24" rx="7" fill="#EDF2FA"/>
<text x="603.0" y="362" text-anchor="middle" font-size="13" font-weight="600" style="fill:#4777B5">06</text>
<text x="628.0" y="362" font-size="18" font-weight="500">曲面积分完整例题</text>
<text x="628.0" y="411" font-size="14" class="muted">斜面、抛物面、球面、柱面</text>
<circle cx="64" cy="470" r="12" fill="#8263A9"/>
<rect x="98" y="444" width="982" height="132" rx="16" fill="white" stroke="#E0E7EE"/>
<text x="120" y="472" font-size="18" font-weight="600" style="fill:#8263A9">统一视角 → 物理应用</text>
<text x="1058" y="472" text-anchor="end" font-size="14" class="muted">§7—§8</text>
<rect x="120.0" y="492" width="30" height="24" rx="7" fill="#F2EDF8"/>
<text x="135.0" y="510" text-anchor="middle" font-size="13" font-weight="600" style="fill:#8263A9">07</text>
<text x="160.0" y="510" font-size="18" font-weight="500">几何形体积分的统一视角</text>
<text x="160.0" y="559" font-size="14" class="muted">长度、面积、体积的共同思想</text>
<text x="574.0" y="522" text-anchor="middle" font-size="20" style="fill:#8263A9">→</text>
<rect x="588.0" y="492" width="30" height="24" rx="7" fill="#F2EDF8"/>
<text x="603.0" y="510" text-anchor="middle" font-size="13" font-weight="600" style="fill:#8263A9">08</text>
<text x="628.0" y="510" font-size="18" font-weight="500">质量、质心、转动惯量与引力</text>
<text x="628.0" y="559" font-size="14" class="muted">质量 → 质心 → 惯量 → 引力</text>
<circle cx="64" cy="618" r="12" fill="#BD784B"/>
<rect x="98" y="592" width="982" height="132" rx="16" fill="white" stroke="#E0E7EE"/>
<text x="120" y="620" font-size="18" font-weight="600" style="fill:#BD784B">方法整理 → 自测</text>
<text x="1058" y="620" text-anchor="end" font-size="14" class="muted">§9—§10</text>
<rect x="120.0" y="640" width="30" height="24" rx="7" fill="#FAF0E8"/>
<text x="135.0" y="658" text-anchor="middle" font-size="13" font-weight="600" style="fill:#BD784B">09</text>
<text x="160.0" y="658" font-size="18" font-weight="500">方法选择与易错点</text>
<text x="160.0" y="707" font-size="14" class="muted">按条件选择计算方法</text>
<text x="574.0" y="670" text-anchor="middle" font-size="20" style="fill:#BD784B">→</text>
<rect x="588.0" y="640" width="30" height="24" rx="7" fill="#FAF0E8"/>
<text x="603.0" y="658" text-anchor="middle" font-size="13" font-weight="600" style="fill:#BD784B">10</text>
<text x="628.0" y="658" font-size="18" font-weight="500">自测与完整解答</text>
<text x="628.0" y="707" font-size="14" class="muted">先独立作答，再核对解答</text>
<path d="M40 754 H1080" stroke="#DFE6EE"/>
<text x="40" y="786" font-size="16" class="muted">01—10 与下文十个小节一一对应；§编号指本教程小节。</text>
<text x="1080" y="786" text-anchor="end" font-size="16" class="muted">每一步都承接上一步</text>
</svg>