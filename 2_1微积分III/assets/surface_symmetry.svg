<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">球面外侧的上下对称性</title><desc id="desc">外法向的z分量在上下反号，R为偶时相消，为奇时同号。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="36" font-size="25" fill="#244052" font-weight="650" text-anchor="start">上下对称时，函数与法向要一起配对</text><circle cx="270" cy="220" r="110" fill="#eef5f7" stroke="#7694a3" stroke-width="2"/><path d="M125,220 L415,220" fill="none" stroke="#9aadb7" stroke-width="2" stroke-dasharray="6 5"/><path d="M270,145 L270,83" fill="none" stroke="#9aadb7" stroke-width="2" marker-end="url(#arrow)"/><path d="M270,295 L270,357" fill="none" stroke="#9aadb7" stroke-width="2" marker-end="url(#arrow)"/><text x="283" y="115" font-size="18" fill="#244052" font-weight="400" text-anchor="start">n_z &gt; 0</text><text x="283" y="343" font-size="18" fill="#244052" font-weight="400" text-anchor="start">n_z &lt; 0</text><text x="270" y="180" font-size="20" fill="#244052" font-weight="400" text-anchor="middle">R = +1</text><text x="270" y="275" font-size="20" fill="#244052" font-weight="400" text-anchor="middle">R = +1</text><text x="270" y="395" font-size="22" fill="#59739c" font-weight="600" text-anchor="middle">R = 1：偶函数</text><text x="270" y="435" font-size="21" fill="#59739c" font-weight="400" text-anchor="middle">贡献相消 → 总积分为 0</text><circle cx="790" cy="220" r="110" fill="#eef5f7" stroke="#7694a3" stroke-width="2"/><path d="M645,220 L935,220" fill="none" stroke="#9aadb7" stroke-width="2" stroke-dasharray="6 5"/><path d="M790,145 L790,83" fill="none" stroke="#9aadb7" stroke-width="2" marker-end="url(#arrow)"/><path d="M790,295 L790,357" fill="none" stroke="#9aadb7" stroke-width="2" marker-end="url(#arrow)"/><text x="803" y="115" font-size="18" fill="#244052" font-weight="400" text-anchor="start">n_z &gt; 0</text><text x="803" y="343" font-size="18" fill="#244052" font-weight="400" text-anchor="start">n_z &lt; 0</text><text x="790" y="180" font-size="20" fill="#244052" font-weight="400" text-anchor="middle">R = +|z|</text><text x="790" y="275" font-size="20" fill="#244052" font-weight="400" text-anchor="middle">R = −|z|</text><text x="790" y="395" font-size="22" fill="#177f7a" font-weight="600" text-anchor="middle">R = z：奇函数</text><text x="790" y="435" font-size="21" fill="#177f7a" font-weight="400" text-anchor="middle">贡献同号 → 上半球积分加倍</text><text x="30" y="480" font-size="17" fill="#244052" font-weight="400" text-anchor="start">以球面外侧为例：比较的是 R n_z dS，而不是只比较 R。</text></g></svg>