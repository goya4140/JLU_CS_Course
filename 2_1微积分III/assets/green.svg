<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>Green 公式：正向边界让区域在左手边</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="515" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">Green 公式：正向边界让区域在左手边</text><text x="38" y="78" class="small">外边界逆时针，孔洞内边界顺时针。</text><circle cx="270" cy="280" r="155" fill="#dceff1" stroke="#187c87" stroke-width="3"/><circle cx="270" cy="280" r="58" fill="#f5fafb" stroke="#de8a36" stroke-width="3"/><path d="M270,125 L210,136" class="line" marker-end="url(#a)"/><path d="M270,222 L305,232" class="line" marker-end="url(#a)"/><text x="94" y="465" class="label">外圈：逆时针</text><text x="297" y="283" class="label">孔洞</text><rect x="540" y="160" width="410" height="220" rx="12" fill="white" stroke="#bcd4da"/><text x="558" y="194" class="label">边界累积 ↔ 区域累积</text><text x="558" y="228" class="small">∮ Pdx + Qdy</text><text x="558" y="256" class="small">         ↓ Green</text><text x="558" y="284" class="small">∬ (Qₓ - Pᵧ) dxdy</text><text x="558" y="312" class="small">场在整个积分区域内应足够光滑</text></svg>