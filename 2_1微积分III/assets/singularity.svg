<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>奇点与挖洞：光滑条件不能跳过</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="480" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">奇点与挖洞：光滑条件不能跳过</text><text x="38" y="78" class="small">偏导相等是局部信息；绕孔洞的积分仍可能不为零。</text><circle cx="255" cy="270" r="145" fill="#dceff1" stroke="#187c87" stroke-width="3"/><circle cx="255" cy="270" r="48" fill="#fff" stroke="#de8a36" stroke-width="3"/><text x="225" y="278" class="label">奇点</text><path d="M255,125 L195,139" class="line" marker-end="url(#a)"/><path d="M255,222 L285,231" class="line" marker-end="url(#a)"/><rect x="495" y="140" width="465" height="230" rx="12" fill="white" stroke="#bcd4da"/><text x="513" y="174" class="label">在挖去奇点的环域应用 Green</text><text x="513" y="208" class="small">外圈逆时针，内圈顺时针</text><text x="513" y="236" class="small">旋度为零 ⇒ 两条正向边界积分和为零</text><text x="513" y="264" class="small">外圈积分 = 内圈逆时针积分</text><text x="513" y="292" class="small">“偏导相等”不能忽略定义域的洞</text></svg>