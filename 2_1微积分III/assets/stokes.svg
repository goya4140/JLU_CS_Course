<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>Stokes：边界方向与法向量配对</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="490" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">Stokes：边界方向与法向量配对</text><text x="38" y="78" class="small">从法向量指向的那一侧看，正向边界呈逆时针。</text><ellipse cx="280" cy="315" rx="175" ry="75" fill="#dceff1" stroke="#187c87" stroke-width="3"/><path d="M280,315 L280,120" class="line" marker-end="url(#a)"/><path d="M280,240 L215,246" class="line" marker-end="url(#a)"/><text x="295" y="139" class="label">法向量 n</text><text x="108" y="432" class="label">右手四指沿边界，拇指沿法向</text><rect x="560" y="145" width="390" height="230" rx="12" fill="white" stroke="#bcd4da"/><text x="578" y="179" class="label">替换曲面的条件</text><text x="578" y="213" class="small">边界曲线保持相同</text><text x="578" y="241" class="small">法向量与边界方向匹配</text><text x="578" y="269" class="small">向量场在使用的曲面附近光滑</text><text x="578" y="297" class="small">常选平面圆盘降低计算量</text></svg>