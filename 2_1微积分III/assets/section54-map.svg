<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">5.4 · Gauss 公式及其应用</title><desc id="desc">理解公式与散度：完整外边界 + 内部光滑；散度表示局部净流出；直接计算：求散度 → 写立体范围 → 选直角 / 柱 / 球坐标；补面法：开放曲面 → 补成封闭外边界 → 总通量减去补面；挖洞法：排除奇点 → 内边界朝孔洞 → 用易算的小球联系原曲面</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" font-size="25" fill="#244052" font-weight="650" text-anchor="start">5.4 · Gauss 公式及其应用</text><rect x="24" y="224" width="200" height="92" rx="14" fill="#254957" stroke="#254957"/><text x="124" y="265" font-size="22" fill="white" font-weight="600" text-anchor="middle">封闭面通量</text><text x="124" y="294" font-size="22" fill="white" font-weight="600" text-anchor="middle">联系体积分</text><path d="M224,270 C260,270 250,106 286,106" stroke="#177f7a" stroke-width="2.5" fill="none"/><rect x="286" y="70" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#177f7a"/><text x="306" y="100" font-size="22" fill="#177f7a" font-weight="600" text-anchor="start">理解公式与散度</text><text x="306" y="128" font-size="18" fill="#244052" font-weight="400" text-anchor="start">完整外边界 + 内部光滑；散度表示局部净流出</text><path d="M224,270 C260,270 250,206 286,206" stroke="#b27b1c" stroke-width="2.5" fill="none"/><rect x="286" y="170" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#b27b1c"/><text x="306" y="200" font-size="22" fill="#b27b1c" font-weight="600" text-anchor="start">直接计算</text><text x="306" y="228" font-size="18" fill="#244052" font-weight="400" text-anchor="start">求散度 → 写立体范围 → 选直角 / 柱 / 球坐标</text><path d="M224,270 C260,270 250,306 286,306" stroke="#59739c" stroke-width="2.5" fill="none"/><rect x="286" y="270" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#59739c"/><text x="306" y="300" font-size="22" fill="#59739c" font-weight="600" text-anchor="start">补面法</text><text x="306" y="328" font-size="18" fill="#244052" font-weight="400" text-anchor="start">开放曲面 → 补成封闭外边界 → 总通量减去补面</text><path d="M224,270 C260,270 250,406 286,406" stroke="#ae645b" stroke-width="2.5" fill="none"/><rect x="286" y="370" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#ae645b"/><text x="306" y="400" font-size="22" fill="#ae645b" font-weight="600" text-anchor="start">挖洞法</text><text x="306" y="428" font-size="18" fill="#244052" font-weight="400" text-anchor="start">排除奇点 → 内边界朝孔洞 → 用易算的小球联系原曲面</text><text x="28" y="503" font-size="16" fill="#657985" font-weight="400" text-anchor="start">使用前依次核对：是否封闭？哪一侧？内部是否有未处理奇点？</text></g></svg>