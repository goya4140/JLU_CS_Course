<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">5.2 · Green 公式及其应用</title><desc id="desc">理解公式：完整边界 + 正方向 + 场光滑；公共边反向抵消；构造公式：未闭合 → 补线再减；内部有奇点 → 挖洞并计入内边界；计算应用：求偏导差 → 二重积分 / 面积；空间曲线先消元与投影；路径无关与全微分：检查定义域 → 换路径 / 求参数 / 求原函数 → 端点差</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" font-size="25" fill="#244052" font-weight="650" text-anchor="start">5.2 · Green 公式及其应用</text><rect x="24" y="224" width="200" height="92" rx="14" fill="#254957" stroke="#254957"/><text x="124" y="265" font-size="22" fill="white" font-weight="600" text-anchor="middle">平面边界</text><text x="124" y="294" font-size="22" fill="white" font-weight="600" text-anchor="middle">联系区域</text><path d="M224,270 C260,270 250,106 286,106" stroke="#177f7a" stroke-width="2.5" fill="none"/><rect x="286" y="70" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#177f7a"/><text x="306" y="100" font-size="22" fill="#177f7a" font-weight="600" text-anchor="start">理解公式</text><text x="306" y="128" font-size="18" fill="#244052" font-weight="400" text-anchor="start">完整边界 + 正方向 + 场光滑；公共边反向抵消</text><path d="M224,270 C260,270 250,206 286,206" stroke="#b27b1c" stroke-width="2.5" fill="none"/><rect x="286" y="170" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#b27b1c"/><text x="306" y="200" font-size="22" fill="#b27b1c" font-weight="600" text-anchor="start">构造公式</text><text x="306" y="228" font-size="18" fill="#244052" font-weight="400" text-anchor="start">未闭合 → 补线再减；内部有奇点 → 挖洞并计入内边界</text><path d="M224,270 C260,270 250,306 286,306" stroke="#59739c" stroke-width="2.5" fill="none"/><rect x="286" y="270" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#59739c"/><text x="306" y="300" font-size="22" fill="#59739c" font-weight="600" text-anchor="start">计算应用</text><text x="306" y="328" font-size="18" fill="#244052" font-weight="400" text-anchor="start">求偏导差 → 二重积分 / 面积；空间曲线先消元与投影</text><path d="M224,270 C260,270 250,406 286,406" stroke="#ae645b" stroke-width="2.5" fill="none"/><rect x="286" y="370" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#ae645b"/><text x="306" y="400" font-size="22" fill="#ae645b" font-weight="600" text-anchor="start">路径无关与全微分</text><text x="306" y="428" font-size="18" fill="#244052" font-weight="400" text-anchor="start">检查定义域 → 换路径 / 求参数 / 求原函数 → 端点差</text><text x="28" y="503" font-size="16" fill="#657985" font-weight="400" text-anchor="start">注意：Green 可用于有孔区域；偏导相等推出路径无关需核对定义域。</text></g></svg>