<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">5.3 · 第二型曲面积分</title><desc id="desc">理解意义：场的法向分量 × 实际面积；换侧变号；两型关系：三个有向投影面积元 = 对应法向分量 × 实际面积元；分项投影：各项投到对应坐标面 → 定符号 → 消元 → 写投影域；对称性：函数与法向同时配对；先投影后二重积分判断更稳妥；合一投影：三项统一到同一平面；单位法向分母与面积根号抵消</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" font-size="25" fill="#244052" font-weight="650" text-anchor="start">5.3 · 第二型曲面积分</text><rect x="24" y="274" width="200" height="92" rx="14" fill="#254957" stroke="#254957"/><text x="124" y="315" font-size="22" fill="white" font-weight="600" text-anchor="middle">沿指定侧</text><text x="124" y="344" font-size="22" fill="white" font-weight="600" text-anchor="middle">累积通量</text><path d="M224,320 C260,320 250,106 286,106" stroke="#177f7a" stroke-width="2.5" fill="none"/><rect x="286" y="70" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#177f7a"/><text x="306" y="100" font-size="22" fill="#177f7a" font-weight="600" text-anchor="start">理解意义</text><text x="306" y="128" font-size="18" fill="#244052" font-weight="400" text-anchor="start">场的法向分量 × 实际面积；换侧变号</text><path d="M224,320 C260,320 250,206 286,206" stroke="#b27b1c" stroke-width="2.5" fill="none"/><rect x="286" y="170" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#b27b1c"/><text x="306" y="200" font-size="22" fill="#b27b1c" font-weight="600" text-anchor="start">两型关系</text><text x="306" y="228" font-size="18" fill="#244052" font-weight="400" text-anchor="start">三个有向投影面积元 = 对应法向分量 × 实际面积元</text><path d="M224,320 C260,320 250,306 286,306" stroke="#59739c" stroke-width="2.5" fill="none"/><rect x="286" y="270" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#59739c"/><text x="306" y="300" font-size="22" fill="#59739c" font-weight="600" text-anchor="start">分项投影</text><text x="306" y="328" font-size="18" fill="#244052" font-weight="400" text-anchor="start">各项投到对应坐标面 → 定符号 → 消元 → 写投影域</text><path d="M224,320 C260,320 250,406 286,406" stroke="#ae645b" stroke-width="2.5" fill="none"/><rect x="286" y="370" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#ae645b"/><text x="306" y="400" font-size="22" fill="#ae645b" font-weight="600" text-anchor="start">对称性</text><text x="306" y="428" font-size="18" fill="#244052" font-weight="400" text-anchor="start">函数与法向同时配对；先投影后二重积分判断更稳妥</text><path d="M224,320 C260,320 250,506 286,506" stroke="#697b4b" stroke-width="2.5" fill="none"/><rect x="286" y="470" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#697b4b"/><text x="306" y="500" font-size="22" fill="#697b4b" font-weight="600" text-anchor="start">合一投影</text><text x="306" y="528" font-size="18" fill="#244052" font-weight="400" text-anchor="start">三项统一到同一平面；单位法向分母与面积根号抵消</text><text x="28" y="603" font-size="16" fill="#657985" font-weight="400" text-anchor="start">参数法与叉积计算放在扩展；封闭面及补面方法接续 5.4。</text></g></svg>