<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>对称性要同时检查积分域与函数</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">对称性要同时检查积分域与函数</text><text x="38" y="78" class="small">第一型微元在镜像变换下保持不变；第二型还需要检查方向。</text><circle cx="240" cy="270" r="130" fill="#e2f1f2" stroke="#187c87" stroke-width="3"/><path d="M75,270 L415,270" fill="none" stroke="#8ca8b2" stroke-width="1"/><path d="M240,115 L240,430" fill="none" stroke="#8ca8b2" stroke-width="1"/><circle cx="330" cy="230" r="7" fill="#187c87"/><circle cx="150" cy="230" r="7" fill="#de8a36"/><text x="312" y="205" class="label">(x,y)</text><text x="94" y="205" class="label">(-x,y)</text><rect x="490" y="140" width="440" height="220" rx="12" fill="white" stroke="#bcd4da"/><text x="508" y="174" class="label">镜像配对</text><text x="508" y="208" class="small">f(-x,y) = -f(x,y) → 两点贡献抵消</text><text x="508" y="236" class="small">f(-x,y) =  f(x,y) → 两点贡献相等</text><text x="508" y="264" class="small">域不对称时，以上结论不能直接使用</text><text x="508" y="292" class="small">球面上 ∫x²dS = ∫y²dS = ∫z²dS</text></svg>