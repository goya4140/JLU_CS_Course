<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>曲面与投影：面积修正因子</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="510" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">曲面与投影：面积修正因子</text><text x="38" y="78" class="small">曲面倾斜时，真实面积通常大于它在坐标面上的投影面积。</text><path d="M150,215 L410,145 L600,280 L340,350 Z" fill="#c7e5e9" stroke="#187c87" stroke-width="3"/><path d="M150,390 L410,320 L600,390 L340,460 Z" fill="#e9eef1" stroke="#7899a5" stroke-width="2"/><path d="M150,215 L150,390" fill="none" stroke="#9caeb5" stroke-width="1"/><path d="M410,145 L410,320" fill="none" stroke="#9caeb5" stroke-width="1"/><path d="M600,280 L600,390" fill="none" stroke="#9caeb5" stroke-width="1"/><path d="M340,350 L340,460" fill="none" stroke="#9caeb5" stroke-width="1"/><text x="250" y="232" class="label">曲面 z = g(x,y)</text><text x="220" y="398" class="label">投影域 D</text><rect x="655" y="150" width="310" height="160" rx="12" fill="white" stroke="#bcd4da"/><text x="673" y="184" class="label">上侧法向量</text><text x="673" y="218" class="small">方向向量：(-gₓ,-gᵧ,1)</text><text x="673" y="246" class="small">第一型：取它的长度</text><text x="673" y="274" class="small">第二型：保留整个向量</text></svg>