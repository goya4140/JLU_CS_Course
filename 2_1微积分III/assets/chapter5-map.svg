<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">第5章 · 第二型积分知识导图</title><desc id="desc">5.1 曲线积分：做功：切向位移 → 两型关系 → 参数 / 直角坐标 → 对称性；5.2 Green：平面闭路 ↔ 平面区域：条件与方向 → 补线 / 挖洞 → 面积 / 投影 → 全微分与路径无关；5.3 曲面积分：通量：法向与有向面积元 → 分项投影 → 对称性 → 合一投影；5.4 Gauss：封闭面 ↔ 体积：散度 → 直接三重积分 → 补面 → 挖洞；5.5 Stokes：空间闭路 ↔ 所张面：右手定向 → 旋度 → 选简单面 → 复用曲面积分方法</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" font-size="25" fill="#244052" font-weight="650" text-anchor="start">第5章 · 第二型积分知识导图</text><rect x="24" y="274" width="200" height="92" rx="14" fill="#254957" stroke="#254957"/><text x="124" y="315" font-size="22" fill="white" font-weight="600" text-anchor="middle">方向与</text><text x="124" y="344" font-size="22" fill="white" font-weight="600" text-anchor="middle">有向累积</text><path d="M224,320 C260,320 250,106 286,106" stroke="#177f7a" stroke-width="2.5" fill="none"/><rect x="286" y="70" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#177f7a"/><text x="306" y="100" font-size="22" fill="#177f7a" font-weight="600" text-anchor="start">5.1 曲线积分：做功</text><text x="306" y="128" font-size="18" fill="#244052" font-weight="400" text-anchor="start">切向位移 → 两型关系 → 参数 / 直角坐标 → 对称性</text><path d="M224,320 C260,320 250,206 286,206" stroke="#b27b1c" stroke-width="2.5" fill="none"/><rect x="286" y="170" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#b27b1c"/><text x="306" y="200" font-size="22" fill="#b27b1c" font-weight="600" text-anchor="start">5.2 Green：平面闭路 ↔ 平面区域</text><text x="306" y="228" font-size="18" fill="#244052" font-weight="400" text-anchor="start">条件与方向 → 补线 / 挖洞 → 面积 / 投影 → 全微分与路径无关</text><path d="M224,320 C260,320 250,306 286,306" stroke="#59739c" stroke-width="2.5" fill="none"/><rect x="286" y="270" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#59739c"/><text x="306" y="300" font-size="22" fill="#59739c" font-weight="600" text-anchor="start">5.3 曲面积分：通量</text><text x="306" y="328" font-size="18" fill="#244052" font-weight="400" text-anchor="start">法向与有向面积元 → 分项投影 → 对称性 → 合一投影</text><path d="M224,320 C260,320 250,406 286,406" stroke="#ae645b" stroke-width="2.5" fill="none"/><rect x="286" y="370" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#ae645b"/><text x="306" y="400" font-size="22" fill="#ae645b" font-weight="600" text-anchor="start">5.4 Gauss：封闭面 ↔ 体积</text><text x="306" y="428" font-size="18" fill="#244052" font-weight="400" text-anchor="start">散度 → 直接三重积分 → 补面 → 挖洞</text><path d="M224,320 C260,320 250,506 286,506" stroke="#697b4b" stroke-width="2.5" fill="none"/><rect x="286" y="470" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#697b4b"/><text x="306" y="500" font-size="22" fill="#697b4b" font-weight="600" text-anchor="start">5.5 Stokes：空间闭路 ↔ 所张面</text><text x="306" y="528" font-size="18" fill="#244052" font-weight="400" text-anchor="start">右手定向 → 旋度 → 选简单面 → 复用曲面积分方法</text><text x="28" y="603" font-size="16" fill="#657985" font-weight="400" text-anchor="start">学习顺序：5.1 → 5.2；5.3 → 5.4；5.5 联系曲线、曲面与 Green。</text></g></svg>