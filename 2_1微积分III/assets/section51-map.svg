<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">5.1 · 第二型曲线积分</title><desc id="desc">理解意义：力与位移点积 → 定义 → 线性 / 分段可加 / 反向变号；两型关系：弧长参数 → 单位切向量 → 方向余弦 → 切向分量乘弧长；直接计算：选参数 / 选 x 或 y → 同步替换微分 → 起终点决定上下限；对称性与选择：同时看函数、微分、方向；变量不单值时分段</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526b7c"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#fbfdfd"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" font-size="25" fill="#244052" font-weight="650" text-anchor="start">5.1 · 第二型曲线积分</text><rect x="24" y="224" width="200" height="92" rx="14" fill="#254957" stroke="#254957"/><text x="124" y="265" font-size="22" fill="white" font-weight="600" text-anchor="middle">沿有向曲线</text><text x="124" y="294" font-size="22" fill="white" font-weight="600" text-anchor="middle">累积做功</text><path d="M224,270 C260,270 250,106 286,106" stroke="#177f7a" stroke-width="2.5" fill="none"/><rect x="286" y="70" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#177f7a"/><text x="306" y="100" font-size="22" fill="#177f7a" font-weight="600" text-anchor="start">理解意义</text><text x="306" y="128" font-size="18" fill="#244052" font-weight="400" text-anchor="start">力与位移点积 → 定义 → 线性 / 分段可加 / 反向变号</text><path d="M224,270 C260,270 250,206 286,206" stroke="#b27b1c" stroke-width="2.5" fill="none"/><rect x="286" y="170" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#b27b1c"/><text x="306" y="200" font-size="22" fill="#b27b1c" font-weight="600" text-anchor="start">两型关系</text><text x="306" y="228" font-size="18" fill="#244052" font-weight="400" text-anchor="start">弧长参数 → 单位切向量 → 方向余弦 → 切向分量乘弧长</text><path d="M224,270 C260,270 250,306 286,306" stroke="#59739c" stroke-width="2.5" fill="none"/><rect x="286" y="270" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#59739c"/><text x="306" y="300" font-size="22" fill="#59739c" font-weight="600" text-anchor="start">直接计算</text><text x="306" y="328" font-size="18" fill="#244052" font-weight="400" text-anchor="start">选参数 / 选 x 或 y → 同步替换微分 → 起终点决定上下限</text><path d="M224,270 C260,270 250,406 286,406" stroke="#ae645b" stroke-width="2.5" fill="none"/><rect x="286" y="370" width="766" height="76" rx="14" fill="#f5f9f9" stroke="#ae645b"/><text x="306" y="400" font-size="22" fill="#ae645b" font-weight="600" text-anchor="start">对称性与选择</text><text x="306" y="428" font-size="18" fill="#244052" font-weight="400" text-anchor="start">同时看函数、微分、方向；变量不单值时分段</text><text x="28" y="503" font-size="16" fill="#657985" font-weight="400" text-anchor="start">正文按分支顺序学习；证明可展开，例题紧跟方法。</text></g></svg>