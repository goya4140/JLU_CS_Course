<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>补线：把开曲线变成闭曲线</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="480" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">补线：把开曲线变成闭曲线</text><text x="38" y="78" class="small">先明确新增路径的行进方向，再从闭合积分中减去补线积分。</text><path d="M130,350 Q280,110 450,230" fill="none" stroke="#187c87" stroke-width="3"/><path d="M277,187 L313,190" class="line" marker-end="url(#a)"/><path d="M450,230 L130,350" class="line" marker-end="url(#a)"/><text x="94" y="376" class="label">A</text><text x="457" y="225" class="label">B</text><text x="270" y="150" class="label">原曲线 L：A → B</text><text x="257" y="337" class="label">补线 C：B → A</text><rect x="560" y="160" width="390" height="210" rx="12" fill="white" stroke="#bcd4da"/><text x="578" y="194" class="label">公式账本</text><text x="578" y="228" class="small">L + C 是正向闭曲线时</text><text x="578" y="256" class="small">∫L + ∫C = ∬D (Qₓ - Pᵧ)</text><text x="578" y="284" class="small">所以 ∫L = ∬D (…) - ∫C</text><text x="578" y="312" class="small">如果闭合方向为负，整体加负号</text></svg>