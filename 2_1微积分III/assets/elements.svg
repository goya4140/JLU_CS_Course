<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>微元：ds 与 dS 从哪里来</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">微元：ds 与 dS 从哪里来</text><text x="38" y="78" class="small">换元既要替换函数，也要替换曲线长度或曲面面积。</text><path d="M70,340 Q210,90 430,310" fill="none" stroke="#187c87" stroke-width="3"/><path d="M245,203 L300,214" fill="none" stroke="#de8a36" stroke-width="9"/><path d="M245,203 L300,203" class="line" marker-end="url(#a)"/><path d="M300,203 L300,214" class="line" marker-end="url(#a)"/><text x="246" y="185" class="label">dx</text><text x="313" y="218" class="label">dy</text><text x="205" y="263" class="label">ds² = dx² + dy²</text><text x="80" y="398" class="label">曲线：ds = |r′(t)| dt</text><path d="M590,330 L810,370 L920,190 L700,150 Z" fill="#d4eaf0" stroke="#187c87" stroke-width="3"/><path d="M700,150 L810,170" class="line" marker-end="url(#a)"/><path d="M700,150 L650,230" class="line" marker-end="url(#a)"/><text x="800" y="144" class="label">rᵤ du</text><text x="563" y="231" class="label">rᵥ dv</text><text x="575" y="414" class="label">曲面：dS = |rᵤ × rᵥ| du dv</text></svg>