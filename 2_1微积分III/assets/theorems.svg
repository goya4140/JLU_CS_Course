<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img"><title>三个公式的关系：边界与内部</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="415" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">三个公式的关系：边界与内部</text><text x="38" y="78" class="small">先辨认积分对象，再检查封闭性、方向和光滑条件。</text><rect x="40" y="145" width="290" height="220" rx="12" fill="white" stroke="#bcd4da"/><text x="58" y="179" class="label">Green · 平面</text><text x="58" y="213" class="small">边界：平面闭曲线</text><text x="58" y="241" class="small">内部：平面区域</text><text x="58" y="269" class="small">微分：Qₓ - Pᵧ</text><text x="58" y="297" class="small">结果：二重积分</text><rect x="355" y="145" width="290" height="220" rx="12" fill="white" stroke="#bcd4da"/><text x="373" y="179" class="label">Gauss · 通量</text><text x="373" y="213" class="small">边界：封闭曲面</text><text x="373" y="241" class="small">内部：三维立体</text><text x="373" y="269" class="small">微分：散度 div F</text><text x="373" y="297" class="small">结果：三重积分</text><rect x="670" y="145" width="290" height="220" rx="12" fill="white" stroke="#bcd4da"/><text x="688" y="179" class="label">Stokes · 环流</text><text x="688" y="213" class="small">边界：空间闭曲线</text><text x="688" y="241" class="small">内部：所张曲面</text><text x="688" y="269" class="small">微分：旋度 curl F</text><text x="688" y="297" class="small">结果：第二型曲面积分</text></svg>