<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>通量：向量场穿过曲面的分量</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="470" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">通量：向量场穿过曲面的分量</text><text x="38" y="78" class="small">切向分量不穿过曲面；法向分量决定通量的正负。</text><ellipse cx="290" cy="305" rx="195" ry="70" fill="#dceff1" stroke="#187c87" stroke-width="3"/><path d="M290,305 L290,145" class="line" marker-end="url(#a)"/><path d="M290,305 L410,185" class="line" marker-end="url(#a)"/><path d="M290,305 L410,305" class="line" marker-end="url(#a)"/><text x="238" y="123" class="label">单位法向量 n</text><text x="417" y="181" class="label">向量场 F</text><text x="403" y="343" class="label">切向分量</text><rect x="580" y="150" width="360" height="215" rx="12" fill="white" stroke="#bcd4da"/><text x="598" y="184" class="label">向量面积元</text><text x="598" y="218" class="small">n dS：法向量 × 面积</text><text x="598" y="246" class="small">F · n &gt; 0：沿选定法向穿出</text><text x="598" y="274" class="small">换侧：n → -n，积分变号</text><text x="598" y="302" class="small">上侧时 n 的 z 分量为正</text></svg>