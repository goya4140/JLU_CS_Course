<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>第一型与第二型：方向的差别</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="460" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">第一型与第二型：方向的差别</text><text x="38" y="78" class="small">沿同一段路径反向行进，长度不变；位移向量反向。</text><path d="M100,200 L380,200" class="line" marker-end="url(#a)"/><path d="M380,290 L100,290" class="line" marker-end="url(#a)"/><text x="95" y="160" class="label">A</text><text x="375" y="160" class="label">B</text><text x="100" y="340" class="label">ds 始终表示非负长度</text><text x="100" y="380" class="label">dx、dy、dz 保留变化的符号</text><rect x="520" y="150" width="420" height="235" rx="12" fill="white" stroke="#bcd4da"/><text x="538" y="184" class="label">反向后的结果</text><text x="538" y="218" class="small">第一型：∫ f ds 不变</text><text x="538" y="246" class="small">第二型：∫ F · dr 变号</text><text x="538" y="274" class="small">用参数时：顺着题目方向选区间</text><text x="538" y="302" class="small">第一型反向时需保持正弧长元</text></svg>