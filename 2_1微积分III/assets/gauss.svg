<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img"><title>Gauss：封闭面的总通量来自内部散度</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#187c87"/></marker></defs><rect width="1000" height="505" rx="18" fill="#f5fafb"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#213d49}.line{fill:none;stroke:#187c87;stroke-width:3}.small{font-size:19px}.label{font-size:22px}</style><text x="38" y="47" font-size="28" font-weight="bold">Gauss：封闭面的总通量来自内部散度</text><text x="38" y="78" class="small">开放曲面可补面封闭；所有面应按同一立体的外侧定向。</text><path d="M130,325 Q285,50 440,325" fill="#dceff1" stroke="#187c87" stroke-width="3"/><ellipse cx="285" cy="325" rx="155" ry="40" fill="#e9eef1" stroke="#de8a36" stroke-width="3"/><path d="M285,140 L285,100" class="line" marker-end="url(#a)"/><path d="M150,220 L108,200" class="line" marker-end="url(#a)"/><path d="M420,220 L465,200" class="line" marker-end="url(#a)"/><path d="M285,325 L285,402" class="line" marker-end="url(#a)"/><text x="115" y="453" class="label">补底面：外法向朝下</text><rect x="555" y="150" width="400" height="235" rx="12" fill="white" stroke="#bcd4da"/><text x="573" y="184" class="label">补面计算</text><text x="573" y="218" class="small">曲面 Σ + 底面 B = 封闭面</text><text x="573" y="246" class="small">∫Σ F·n dS + ∫B F·n dS</text><text x="573" y="274" class="small">               = ∭Ω div F dV</text><text x="573" y="302" class="small">求原曲面：体积分减去补面通量</text></svg>