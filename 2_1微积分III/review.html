。这里只处理第4、5章相关题型；第6章无穷级数、第7章微分方程留待下一版。下面六题已对照原试卷图像核验公式，答案为本教程推导，非官方评分答案。\n\n## 1 用题型安排复习\n\n|复习环节|应做到|教程入口|\n|---|---|---|\n|补基础|能区分 $ds,dS,dxdy$ 与向量面积元|[第4章 §1—§5](04_第一型积分_教程.md)|\n|第一型计算|圆弧、折线、空间曲线；曲面投影与参数|[第4章 §3—§6](04_第一型积分_教程.md)|\n|应用模型|先写质量元，再写坐标或距离平方权重|[第4章 §7—§8](04_第一型积分_教程.md)|\n|第二型直接算|按路径方向代入 $dx,dy,dz$|[第5章 §1—§2](05_第二型积分_教程.md)|\n|定理选法|全微分、Green、Gauss、Stokes 各适用何种对象|[第5章 §3—§10](05_第二型积分_教程.md)|\n|限时训练|独立写出条件、微元、范围、计算与检查|本页六题及两章自测|\n\n完整学习时按正文顺序读；已有基础时先做两章自测，将错误归到“模型、微元、范围、方向、条件、运算”中的一项，再回到对应段落。不要仅把错题归为粗心。\n\n## 2 2021—2022 学年：空间曲线第一型积分\n\n本地 `期末真题/21-22.pdf`，PDF第3页，第三题：$x=3t,y=3t^2,z=2t^3,0\\le t\\le1$，计算 $\\int_L4xds$。\n\n**识别**：$ds$ 是第一型；曲线已给参数，直接计算速度长度。\n\n$$\nds=\\sqrt{9+36t^2+36t^4}dt=3(1+2t^2)dt.\n$$\n\n因为 $1+2t^2>0$，开方后可直接取正值。于是\n\n$$\nI=\\int_0^1 12t\\cdot3(1+2t^2)dt\n=\\left[18t^2+18t^4\\right]_0^1=36.\n$$\n\n**复盘**：先观察根号能否成为完全平方，避免把本来简单的定积分做复杂。\n\n## 3 2021—2022 学年：开放曲面的补面\n\n同卷第六题：$\\Sigma:x^2+y^2=z^4,0\\le z\\le1$ 的下侧，计算\n\n$$\nI=\\iint_\\Sigma(x^2-y)dydz+(y^2-z)dzdx+(z^2-x)dxdy.\n$$\n\n**识别侧**：对立体 $\\Omega:0\\le z\\le1,x^2+y^2\\le z^4$，侧面的外法向有负的 $z$ 分量，因此题目的“下侧”就是外侧（顶点处用分片或极限处理）。在 $z=1$ 补单位圆盘 $B$，取向上外侧。\n\n散度为 $2x+2y+2z$。每个横截面关于 $x,y$ 对称，奇项积分为零，故\n\n$$\n\\iiint_\\Omega\\operatorname{div}\\mathbf FdV\n=\\int_0^1 2z\\cdot\\pi z^4dz=\\frac\\pi3.\n$$\n\n补面上只有 $Rdxdy$，$R=1-x$，其积分为 $\\pi$，所以\n\n$$\nI=\\frac\\pi3-\\pi=-\\frac{2\\pi}{3}.\n$$\n\n**复盘**：“下侧”不能自动理解为某个半球的内侧，必须结合当前几何对象判断。这里与上半球的情况不同。\n\n## 4 2021—2022 学年：非平面边界与 Stokes\n\n同卷第七题：$\\Gamma$ 为 $x^2+y^2=1$ 与 $z=2x^2+y^2$ 的交线，从 $z$ 轴正向望向负向看为逆时针，计算\n\n$$\nI=\\oint_\\Gamma(y-z)dx+(z-x)dy+(x-y)dz.\n$$\n\n取所张曲面 $z=g(x,y)=2x^2+y^2$ 的上侧，投影为单位圆盘 $D$。\n\n$$\n\\operatorname{curl}\\mathbf F=(-2,-2,-2),\\qquad\n\\mathbf n dS=(-4x,-2y,1)dxdy.\n$$\n\n因此\n\n$$\nI=\\iint_D(8x+4y-2)dxdy=-2\\pi.\n$$\n\n**复盘**：空间闭曲线无需是平面曲线才能用 Stokes。这里保留原图形曲面后，旋度与对称性让计算很短。\n\n## 5 2023—2024 学年：复杂路径与全微分\n\n本地 `期末真题/23-24 .pdf`，PDF第4页（印刷第3页），第四题：曲线 $y=x/\\sin x$ 从 $(0,1)$ 到 $(\\pi/2,\\pi/2)$，计算 $\\int_\\Gamma x^2dx+y^2dy$。\n\n起点的函数值按 $x\\to0$ 的连续延拓理解。积分表达式具有势函数\n\n$$\nu=(x^3+y^3)/3,\n$$\n\n所以不用求 $y'$：\n\n$$\nI=u(\\pi/2,\\pi/2)-u(0,1)=\\frac{\\pi^3}{12}-\\frac13.\n$$\n\n**复盘**：先检查微分表达式，复杂的曲线方程不一定需要参与运算。\n\n## 6 2023—2024 学年：球面与平面的交线\n\n同卷第五题：球面 $x^2+y^2+z^2=a^2$ 与平面 $x+y+z=0$ 的交线，从 $x$ 轴正向看为逆时针，求 $\\oint_\\Gamma ydx+zdy+xdz$。\n\n$\\mathbf F=(y,z,x)$，旋度为 $(-1,-1,-1)$。交线是半径 $a$ 的大圆。选平面圆盘的单位法向 $\\mathbf n=(1,1,1)/\\sqrt3$，其 $x$ 分量为正，与题意方向匹配。因此\n\n$$\nI=(-1,-1,-1)\\cdot\\frac{(1,1,1)}{\\sqrt3}\\cdot\\pi a^2\n=-\\sqrt3\\pi a^2.\n$$\n\n**复盘**：从 $+x$ 侧看方向，就检查法向的 $x$ 分量；从 $+z$ 侧看方向，就检查 $z$ 分量。\n\n## 7 2023—2024 学年：半球下侧\n\n同卷第六题：单位上半球 $x^2+y^2+z^2=1,z\\ge0$ 的下侧，求 $\\iint_\\Sigma xdydz$。\n\n取 $\\mathbf F=(x,0,0)$，散度为1。上半球外侧与底盘封闭成半球体，底盘法向沿 $z$ 轴而场只有 $x$ 分量，底盘通量为零。因此上半球外侧通量为 $2\\pi/3$。\n\n上半球的下侧是内侧，故所求\n\n$$\nI=-\\frac{2\\pi}{3}.\n$$\n\n**复盘**：第一型的 $\\iint_\\Sigma xdS$ 因奇对称为零；本题第二型的 $xdydz=xn_xdS$ 中 $xn_x$ 在球面外侧为 $x^2$，不能套同一奇对称结论。\n\n## 8 考前一页速查\n\n|对象|计算核心|\n|---|---|\n|第一型曲线|$f(\\mathbf r(t))\\lVert\\mathbf r'(t)\\rVert dt$|\n|第一型曲面|$f(\\mathbf r(u,v))\\lVert\\mathbf r_u\\times\\mathbf r_v\\rVert dudv$|\n|第二型曲线|$\\mathbf F(\\mathbf r(t))\\cdot\\mathbf r'(t)dt$|\n|第二型曲面|$\\mathbf F(\\mathbf r(u,v))\\cdot(\\mathbf r_u\\times\\mathbf r_v)dudv$，方向匹配|\n|$z=g(x,y)$ 第一型|$dS=\\sqrt{1+g_x^2+g_y^2}dxdy$|\n|$z=g(x,y)$ 上侧第二型|$\\mathbf n dS=(-g_x,-g_y,1)dxdy$|\n|Green|$\\oint Pdx+Qdy=\\iint(Q_x-P_y)dxdy$|\n|Gauss|$\\iint\\mathbf F\\cdot\\mathbf n dS=\\iiint\\operatorname{div}\\mathbf FdV$，外侧封闭|\n|Stokes|$\\oint\\mathbf F\\cdot d\\mathbf r=\\iint\\operatorname{curl}\\mathbf F\\cdot\\mathbf n dS$，右手方向|\n|全微分|$\\int_A^B du=u(B)-u(A)$|\n\n速查公式用于回忆，适用条件应回看正文。最后核对五项：对象是否正确、微元是否完整、范围是否覆盖一次、方向是否匹配、定理区域是否包含奇点。\n", "links": {"README.md": "index.html", "04_第一型积分_教程.md": "chapter4.html", "05_第二型积分_教程.md": "chapter5.html", "06_期末题型与复习路线.md": "review.html", "资料依据与覆盖对照.md": "sources.html", "https://goya4140.github.io/JLU_CS_Course/2_1%E5%BE%AE%E7%A7%AF%E5%88%86III/index.html": "index.html"}}</script><script src="assets/vend
